<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Connect with GK Signature Events • Decors | Hyderabad</title>

  <link rel="canonical" href="https://gksignature.vercel.app/connect">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GK Signature Events • Decors">
  <meta property="og:title" content="Connect with GK Signature Events • Decors">

  <meta property="og:image" content="https://gksignature.vercel.app/images/og-image.jpg?v=2">
  <meta property="og:url" content="https://gksignature.vercel.app/connect">

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="/images/logo.png?v=2">

  <style>
    :root {
      --ivory: #fbf7f0;
      --ivory-2: #f4ecdf;
      --ink: #2a211a;
      --muted: #7a6a5c;
      --burgundy: #5a1a2e;
      --burgundy-deep: #3f1020;
      --gold: #b8892f;
      --gold-light: #e2c17c;
      --champagne: linear-gradient(135deg, #f6e3ad 0%, #d9b265 45%, #a87a2a 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Poppins", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(226, 193, 124, .28), transparent 60%),
        radial-gradient(ellipse at 50% 100%, rgba(90, 26, 46, .10), transparent 55%),
        var(--ivory);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(184, 137, 47, .35);
      border-radius: 28px;
      padding: 40px 28px 30px;
      box-shadow: 0 24px 60px rgba(63, 16, 32, .12), inset 0 0 0 6px rgba(255, 255, 255, .6);
      position: relative;
      animation: rise .7s ease both;
    }
    /* thin burgundy top accent */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 96px; height: 4px;
      border-radius: 0 0 4px 4px;
      background: var(--burgundy);
    }

    .logo {
      width: 168px;
      height: 168px;
      margin: 0 auto 18px;
      display: block;
      filter: drop-shadow(0 10px 22px rgba(168, 122, 42, .35));
    }

    h1 {
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      font-size: 2.1rem;
      line-height: 1.1;
      color: var(--burgundy);
    }
    .eyebrow {
      display: block;
      margin-top: 6px;
      font-size: .72rem;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .tagline {
      font-family: "Great Vibes", cursive;
      font-size: 2rem;
      line-height: 1.2;
      text-wrap: balance;
      margin: 14px 0 6px;
      background: linear-gradient(135deg, #c79a45 0%, #a87a2a 55%, #7d5a1c 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin: 10px auto 26px;
      color: var(--gold);
      font-size: .8rem;
    }
    .divider::before, .divider::after {
      content: "";
      width: 64px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    }

    .actions { display: grid; gap: 14px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 58px;
      padding: 14px 20px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: .01em;
      transition: transform .15s ease, box-shadow .2s ease, background-color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .btn svg { width: 22px; height: 22px; flex: none; }
    .btn:active { transform: scale(.98); }
    .btn:focus-visible { outline: 3px solid var(--gold-light); outline-offset: 3px; }

    .btn-primary {
      background: linear-gradient(135deg, #6b2238 0%, var(--burgundy) 55%, var(--burgundy-deep) 100%);
      color: #fff7e8;
      box-shadow: 0 10px 24px rgba(63, 16, 32, .28), inset 0 0 0 1px rgba(226, 193, 124, .45);
    }
    .btn-primary svg { stroke: var(--gold-light); }
    .btn-secondary {
      background: var(--champagne);
      color: var(--burgundy-deep);
      box-shadow: 0 10px 24px rgba(168, 122, 42, .28);
    }
    .btn-secondary svg { fill: var(--burgundy-deep); }
    @media (hover: hover) {
      .btn:hover { transform: translateY(-2px); }
      .btn-primary:hover { box-shadow: 0 14px 30px rgba(63, 16, 32, .34), inset 0 0 0 1px rgba(226, 193, 124, .6); }
      .btn-secondary:hover { box-shadow: 0 14px 30px rgba(168, 122, 42, .36); }
    }

    .foot {
      margin-top: 26px;
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .04em;
    }

    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } .btn { transition: none; } }
    @media (max-width: 360px) {
      .card { padding: 34px 20px 26px; }
      .logo { width: 140px; height: 140px; }
      h1 { font-size: 1.85rem; }
      .tagline { font-size: 1.75rem; }
      .btn { font-size: .9rem; gap: 10px; padding: 14px 14px; white-space: nowrap; }
      .btn svg { width: 20px; height: 20px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/images/logo.png?v=2" alt="GK Signature logo" width="168" height="168">
    <h1>GK Signature</h1>
    <span class="eyebrow">Events • Decors</span>
    <p class="tagline">Where Moments Become Memories</p>
    <div class="divider" aria-hidden="true">✦</div>

    <nav class="actions" aria-label="Connect with GK Signature">
      <a class="btn btn-primary" href="https://gksignature.vercel.app/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5S14.6 18.7 12 21.5M12 2.5C9.4 5.3 8.1 8.5 8.1 12s1.3 6.7 3.9 9.5"/></svg>
        Visit Our Website
      </a>
      <a class="btn btn-secondary" href="https://www.instagram.com/gksignatureevents/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1.1.4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1.1.4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1.1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1.1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.7a5.1 5.1 0 100 10.2 5.1 5.1 0 000-10.2zm0 8.4a3.3 3.3 0 110-6.6 3.3 3.3 0 010 6.6zm5.3-9.8a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>
        Follow Us on Instagram
      </a>
    </nav>

    <p class="foot">Hyderabad, Telangana</p>
  </main>
</body>
</html>
